id: osct
title: Onion Skin & Crocodile Tears
book:
  author: Kévin Bray
  publisher: Building Fictions
# The rules' typed variables (content schema 5.0, #334): declared here, or typed by their first set
variables:
  taps: { type: integer, scope: scene, default: 0 }
  mood: { type: string, scope: experience, default: calm }
# The experience's rules (content schema 5.0, #334): live for the whole session, across scene switches
logic:
  rules:
    - on: targetUnlocked
      when: unlocks < 3 || chapterStarted == false
      do:
        - set: { chapterStarted: true, mood: '"curious"' }
          scope: experience
    - on: chapterFinished
      do: { goto: "scene:cover" }
# The desktop landing's hero (content schema 6.1, #355): a target with a 3D model on a scene – the build extracts the hero
landing:
  scene: studio-a
  target: studio-dragon
  # The landing's own texts (content schema 6.4, #365): by language, field by field – what is left out is the app's text
  texts:
    de:
      intro: "Die Begleit-App zu {title} von {author} – richte dein Handy auf die Seiten."
  # Its shop (schema 6.4): up to 4 items – label, link, picture (a file of this folder) or cover: true
  shop:
    - label: The tree print
      url: https://buildingfictions.com/shop/tree
      image: entries/ancient-tree/images-102.jpg
