# Showcase entry for the editor and the tests (scene studio-a): an entity as a tree of nodes (content schema 2.0).
category: glossary
title: "Studio: tree of nodes"
scene: studio-a
body: "A group with three children: the tree, lifted and turned, a line of text under it, and an orange spot light aimed at the tree from the right."
target:
  image: target.jpg
  entity:
    type: group
    params:
      position: [0, 0.1, 0]
    # The node's rules (content schema 5.0, #334): conditions are expressions; a third tap goes on to the next studio
    components:
      - type: behaviour
        rules:
          - on: found
            when: "!tapped"
            do: { hide: caption }
          - on: tap
            do:
              - set: { tapped: true, taps: "taps + 1" }   # a set value is an expression: a counter
              - emit: groupTapped
          - on: tap
            when: tapped && taps >= 2
            do: { goto: "scene:studio-b" }
    children:
      - type: model
        src: tree.glb
        params:
          rotation: [90, 45, 0]
          position: [0, 0, 0.1]
          scale: 0.7
      - type: text
        name: caption
        text: "{{entry.title}}"
        color: "#f3cc94"
        params:
          position: [0, -0.45, 0.01]
          scale: 0.8
      # A light node (content schema 2.6): a spot aimed along its own −z – turned 45° about y it points down-left onto the tree
      - type: light
        light:
          kind: spot
          color: "#ff9a3c"
          intensity: 0.3
          angle: 35
          penumbra: 0.3
        params:
          position: [0.4, 0, 0.6]
          rotation: [0, 45, 0]
