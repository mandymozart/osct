id: demo
title: The Demo Book
book:
  author: OSCT
  publisher: Building Fictions
environment:
  world: cafe
  onionSky: true
appearance:
  reveal:
    type: revealCode
  found:
    type: printLiftCode
  lost:
    type: fadeCode
  # How the marginalia card is picked up (#361): a card look of plugins/card instead of the built-in cardFlight
  card:
    type: cardDrift
variables:
  hasKey:
    type: boolean
    scope: experience
passes:
  - type: bloom
    strength: 0.1
    radius: 0.1
    threshold: 1
  - type: grade
    contrast: 1.1
    saturation: 1.2
