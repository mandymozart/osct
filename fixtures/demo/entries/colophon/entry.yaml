category: glossary
title: The colophon
scene: back
body: "The back cover: `{{experience.title}}` as a text node, a chest, and the `tally` of the whole book – it says complete when every page was found."
tags:
  - narrative
  - progress
target:
  image: target.jpg
  entity:
    type: group
    components:
      - type: tally
        of: experience
        label: of the book found
        color: "#f3cc94"
      - type: found
        look: fade
    children:
      - type: text
        params:
          position:
            - 0
            - 0.4
            - 0.01
        text: "{{experience.title}}"
        color: "#f3cc94"
      - type: model
        src: chest.glb
        params:
          rotation:
            - 90
            - 0
            - 0
          scale: 0.4
          position:
            - 0
            - 0.05
            - 0
        components:
          - type: reveal
            look: revealCode
            spin: 0.25
  place:
    x: 65
    "y": 120
    width: 100
