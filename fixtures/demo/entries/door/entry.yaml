category: glossary
title: The door
scene: the-door
body: "A door on another page than its key. Its `behaviour` rules: found, the hint shows; found with `hasKey` set, the hint hides and `openDoor` goes out – the `door` plugin listens to it, lifts and turns the door, sets `doorOpen` in the stage scope and emits `doorOpened`. Tap the key on page 1, then come here – or set `hasKey` in the editor's Stage panel and switch the page off and on."
tags:
  - narrative
  - door
target:
  image: target.jpg
  entity:
    type: group
    components:
      - type: door
        lift: 0.35
        seconds: 1.2
      - type: behaviour
        rules:
          - "on": found
            do:
              show: hint
          - "on": found
            when: hasKey == true
            do:
              - hide: hint
              - emit: openDoor
      - type: reveal
        look: inflateDissolve
        spin: 0.25
    children:
      - name: door
        type: model
        src: door.glb
        params:
          rotation:
            - 90
            - 0
            - 0
          position:
            - 0
            - 0
            - -0.0103
          scale: 0.55
      - name: hint
        type: text
        params:
          position:
            - 0
            - -0.4
            - 0.01
          scale: 0.7
        components:
          - type: found
            look: fade
        text: Tap the key on page 1
        color: "#f3cc94"
  place:
    x: 60
    "y": 110
    width: 90
