# The door: a group of two children – the door (a model) and a hint (a text). The `door` component
# (plugins/narrative) reads hasKey when the page is found: with the key the door lifts and turns, doorOpen is set in
# the stage scope and doorOpened is emitted; without it the hint shows.
category: glossary
title: The door
page: 3
body: "A door on another page than its key. Found with `hasKey` set, it opens (the child lifts and turns), sets `doorOpen` in the stage scope and emits `doorOpened`; found without the key, the hint child shows. Switch the page off and on in the editor's Stage panel after finding the key on page 1."
tags: [narrative, door]
target:
  image: target.jpg
  print:
    surface: left
    x: 60
    y: 110
    width: 90
  entity:
    type: group
    children:
      - type: model
        src: door.glb
        params:
          rotation: [90, 0, 0]
          scale: 0.55
      - type: text
        text: "Find the key on page 1"
        color: "#f3cc94"
        params:
          position: [0, -0.4, 0.01]
          scale: 0.7
    components:
      - type: door
        lift: 0.35
        seconds: 1.2
