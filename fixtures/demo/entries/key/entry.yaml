# The key: a model that spins; its first find sets the book variable hasKey (plugins/narrative, component `key`) –
# the door on page 3 reads it. The stand-in model has no animation clip, so the `animation` component waits for one.
category: glossary
title: The key
page: 1
body: "Find the key and keep it: the first find sets `hasKey` in the book scope, persisted with your progress. The door on page 3 opens only with it. A tap rattles the key (the scene event `keyRattled`). The model is the fixture's stand-in (a dragon) – replace it with a key that has an animation clip and the `animation` component plays it on a tap."
tags: [narrative, key]
target:
  image: target.jpg
  print:
    surface: left
    x: 60
    y: 90
    width: 90
  entity:
    type: model
    src: key.glb
    params:
      rotation: [90, 180, 0]
      scale: 0.5
    components:
      - type: spin
        degreesPerSecond: 40
      - type: key
      - type: animation
        playOn: tap
        loop: false
