# The key: a model that spins; its first find sets the book variable hasKey (plugins/narrative, component `key`) –
# the door on page 3 reads it. A tap plays the model's clip `rattle` (the `animation` component). The model is made by
# editor/tools/key-model.mjs (`node editor/tools/key-model.mjs` writes key.glb).
category: glossary
title: The key
page: 1
body: "Find the key and keep it: the first find sets `hasKey` in the book scope, persisted with your progress. The door on page 3 opens only with it. A tap rattles the key: the `animation` component plays its clip `rattle`, and the scene event `keyRattled` goes to the other plugins."
tags: [narrative, key]
target:
  image: target.jpg
  print:
    surface: left
    x: 60
    y: 90
    width: 90
  entity:
    type: model
    src: key.glb
    params:
      scale: 0.6
    components:
      - type: spin
        degreesPerSecond: 40
      - type: key
      - type: animation
        clip: rattle
        playOn: tap
        loop: false
