category: glossary
title: The key
scene: the-key
body: "Tap the key to take it: its `behaviour` rule plays the clip `rattle`, sets `hasKey` in the book scope – persisted with your progress – and sends the scene event `keyRattled` to the stage. The door on page 3 opens only with it. No code: the rule is made in the editor's Entity panel."
tags:
  - narrative
  - key
target:
  image: target.jpg
  entity:
    type: model
    src: key.glb
    params:
      position:
        - 0
        - 0
        - 0.1627
      scale: 0.6
    components:
      - type: spin
        degreesPerSecond: 40
      - type: animation
        clip: rattle
        playOn: never
        loop: false
      - type: behaviour
        rules:
          - "on": tap
            do:
              - play: rattle
              - set:
                  hasKey: true
                scope: experience
              - emit: keyRattled
      - type: reveal
        look: printLift
        duration: 900
      - type: lost
        look: fade
    material:
      type: myModelLook
  place:
    x: 60
    "y": 90
    width: 90
