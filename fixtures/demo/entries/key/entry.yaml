# The key: a model that spins; a tap takes it – the `behaviour` component (rules without code, #88) plays the model's
# clip `rattle`, sets the book variable hasKey (the door on page 3 reads it) and emits the scene event keyRattled. The
# `animation` component says how the clip plays (once, never by itself – the behaviour starts it). The model is made by
# editor/tools/key-model.mjs (`node editor/tools/key-model.mjs` writes key.glb).
category: glossary
title: The key
page: 1
body: "Tap the key to take it: its `behaviour` rule plays the clip `rattle`, sets `hasKey` in the book scope – persisted with your progress – and sends the scene event `keyRattled` to the stage. The door on page 3 opens only with it. No code: the rule is made in the editor's Entity panel."
tags: [narrative, key]
target:
  image: target.jpg
  print:
    surface: left
    x: 60
    y: 90
    width: 90
  entity:
    type: model
    src: key.glb
    params:
      scale: 0.6
    components:
      - type: spin
        degreesPerSecond: 40
      - type: animation
        clip: rattle
        playOn: never
        loop: false
      - type: behaviour
        rules:
          - on: tap
            do:
              - play: rattle
              - set: { hasKey: true }
                scope: book
              - emit: keyRattled
