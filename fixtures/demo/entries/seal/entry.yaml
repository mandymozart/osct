category: glossary
title: The seal
scene: cover
body: An image on the front cover, tinted gold by the `tint` layer and breathing with the `pulse` layer – two plugins' GLSL composed into one material.
tags: []
target:
  image: target.jpg
  entity:
    type: image
    src: seal.jpg
    params:
      scale:
        - 1
        - 0.75
        - 1
    components:
      - type: tint
        color: "#f3cc94"
        opacity: 0.4
      - type: pulse
        color: "#ffffff"
        amount: 0.3
        speed: 0.5
  place:
    x: 65
    "y": 110
    width: 100
