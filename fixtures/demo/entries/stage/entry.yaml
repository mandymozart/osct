category: glossary
title: The switch
scene: the-switch
body: "Three scenes in one entity: a picture, a video with its own alpha, a line of text. The `scenes` component shows one child and a tap shows the next – `scene` in the spread scope says which, `sceneChanged` is emitted."
tags:
  - interaction
  - tap
target:
  image: target.jpg
  entity:
    type: group
    components:
      - type: scenes
        start: 0
    children:
      - type: image
        src: picture.jpg
        params:
          scale:
            - 0.9
            - 0.6
            - 1
          position:
            - 0
            - 0
            - 0.02
      - type: video
        src: sploosh.webm
        params:
          rotation:
            - 0
            - 0
            - 10
          scale: 0.8
      - type: text
        text: Tap me again
        color: "#ffffff"
  place:
    x: 60
    "y": 100
    width: 90
