# The screen: a video standing upright on the page like a screen, tinted (plugins/tint), slowly turning (plugins/spin)
# and shown on a slightly bent sheet of paper (plugins/paper – the sheet is the model file next to it, a `model`
# parameter).
category: video
title: The screen
page: 6
body: "A video standing upright, its bottom edge on the paper, tinted gold and turning slowly around its own axis, on a slightly bent sheet of paper – a layer and two components on one node. The sheet is a model file the `paper` component takes: pick another in its row."
tags: [placement, layer]
target:
  image: target.jpg
  print:
    surface: right
    x: 70
    y: 100
    width: 90
  entity:
    type: video
    src: screen.mp4
    params:
      rotation: [90, 0, 0]
      position: [0, 0, 0.2535]  # half the plane's height (160 / 284 × 0.9): its bottom edge on the page (#189)
      scale: 0.9
    components:
      - type: tint
        color: "#f3cc94"
        opacity: 0.35
      - type: spin
        degreesPerSecond: 15
      - type: paper
        sheet: sheet.glb
