category: video
title: The lamp
scene: the-door
body: "Dark until the door opened: the `lamp` component hides the video until `doorOpen` is set – on this stage, now or earlier – and listens for the change. A chroma key removes the green, the `pulse` layer breathes."
tags:
  - narrative
  - lamp
target:
  image: target.jpg
  entity:
    type: video
    src: lamp.mp4
    params:
      rotation:
        - 90
        - 0
        - 0
      position:
        - 0
        - 0
        - 0.2817
    filters:
      - type: chromaKey
        color: "#00ff00"
        threshold: 0.35
        softness: 0.12
    components:
      - type: lamp
      - type: pulse
        color: "#ffd27a"
        amount: 0.5
        speed: 1.5
  place:
    x: 300
    "y": 110
    width: 90
