# Production https://osct.buildingfictions.com: every push to `main` (merge develop into main when Tilman says
# so – agents/RULES.md #11) deploys the site with Kamal (deploy.yml, GitHub environment "production").
# tag-version.yml tags the version on main at the same time. By hand: Actions → Deploy production → Run workflow.
name: Deploy production (osct.buildingfictions.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

# The called deploy.yml pushes the image to ghcr.io and needs `packages: write`; the repository's default token is
# read-only and a called workflow may not ask for more than its caller grants – so the caller grants it here.
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    uses: ./.github/workflows/deploy.yml
    with:
      destination: production
    secrets: inherit
