# Checks for every push and pull request (agents/RULES.md #9, #10): type checks, tests, content build,
# API tests, the MCP server. Deploys nothing – deploy-staging.yml and deploy-production.yml do (docs/deploy.md).
name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  version:
    name: Version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Strict on develop, main and PRs into them: code changes there need a bump (RULES #23)
      - name: Check version
        run: |
          target="${{ github.base_ref || github.ref_name }}"
          case "$target" in
            develop|main) .github/scripts/check-version.sh --strict ;;
            *) .github/scripts/check-version.sh ;;
          esac

  scripts:
    name: Content build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Tests
        run: npm test
      # The book content is not in git (docs/content-cdn.md): CI builds the test fixture
      - name: Build the test fixture
        run: npm run build:content
        env:
          OSCT_CONTENT_DIR: fixtures/content

  server:
    name: Accounts API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite
      - run: php server/tests/api-test.php

  editor:
    name: Editor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
      # svelte-check covers the editor and the engine files it imports
      - name: Type-check
        run: npm run check
      # plugin-api.d.ts is checked in: it must be what the engine's plugin API gives (before the build rewrites it)
      - name: Plugin API types up to date
        run: npm run plugin-api -- --check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      # The end-to-end test starts the API with PHP's built-in server (skipped without php)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            scripts/package-lock.json
      - run: npm ci
      # The app's types and tests need a game configuration: the test fixture (the book content is not in git)
      - name: Build the test fixture
        run: npm run content
        env:
          OSCT_CONTENT_DIR: fixtures/content
      - name: Type-check
        run: npx tsc --noEmit
      # The service worker has its own scope (lib webworker) – vite-plugin-pwa builds it with `vite build`
      - name: Type-check (service worker)
        run: npx tsc -p sw
      # Missing translations are reported, never fail the run (English is shown instead)
      - name: Translations status
        run: npm run i18n:status
      # Includes the one-version checks (client + scripts package.json, game.config.json)
      - name: Tests
        run: npx vitest run
