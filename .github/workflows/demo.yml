# The demo (fixtures/demo, agents/research/2026-10-30-demo-book.md) is checked here, not synced: since #322 decision (b)
# the demo lives in the staging database like the book – edited in the staging editor and published with its Publish
# button – and fixtures/demo is its committed export (`osct content export --experience demo`, docs/content.md "Export").
# A sync from here would compete with the editor's Publish and overwrite what was published there, so this workflow only
# builds the export with the current engine and scripts: a push that breaks the demo fails here. The CLI still refuses a
# demo build for production (`DEMO.md`, docs/content-cdn.md). Runs by hand, and on a push to develop that touches the demo
# or what it is built with.
name: Demo book

on:
  push:
    branches: [develop]
    paths:
      - "fixtures/demo/**"
      - "engine/**"
      - "shared/**"
      - "scripts/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

concurrency:
  group: content-demo
  cancel-in-progress: false

jobs:
  demo:
    name: Build and check the demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    env:
      OSCT_CONTENT_DIR: fixtures/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build the demo
        run: npm run build:content:force
