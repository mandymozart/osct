# Content sync to the bunny.net CDN, by hand (docs/content-cdn.md). Content has its own lifecycle, apart from the
# app deployment: nothing here runs on a push. It runs the osct CLI (`osct content build`, then `status` or
# `sync`) against the content in this checkout and mirrors it into the environment's one folder on the storage
# zone. Where the sync is triggered from in the long run (this button, a local run, a content repository) is
# open – the CLI is the same everywhere.
#
# GitHub → Settings → Environments → "staging" / "production":
#   variables: BUNNY_STORAGE_ZONE (osct), BUNNY_STORAGE_ZONE_ENDPOINT (storage.bunnycdn.com),
#              CONTENT_BASE_URL (https://buildingfictions.b-cdn.net/<env>)
#   secrets:   BUNNY_STORAGE_PASSWORD (the storage zone's read/write access key)
name: Content sync

on:
  push:
    branches: [claude/heuristic-varahamihira-4faefe] # TEMPORARY: verifying the sync for #5, removed again
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (storage folder and secrets)"
        type: choice
        options: [staging, production]
        default: staging
      command:
        description: "status = show what would change, sync = mirror the content"
        type: choice
        options: [status, sync]
        default: status
      force:
        description: "Upload every file again"
        type: boolean
        default: false

concurrency:
  group: content-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  content:
    name: Content ${{ inputs.command || 'sync' }} (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
      - name: Build the content
        run: |
          npm run build
          npm run osct -- content build
      - name: Content ${{ inputs.command || 'sync' }}
        env:
          OSCT_CONTENT_ENV: ${{ inputs.environment || 'staging' }}
          BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_ZONE_ENDPOINT: ${{ vars.BUNNY_STORAGE_ZONE_ENDPOINT }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          # The sync checks what the CDN serves afterwards
          CONTENT_BASE_URL: ${{ vars.CONTENT_BASE_URL }}
        run: npm run osct -- content ${{ inputs.command || 'sync' }} ${{ inputs.force && '--force' || '' }}
