# Staging https://osct.porschuetz.de: every push to `develop` (or by hand) deploys the site – app + API in
# one container – with Kamal (deploy.yml, GitHub environment "staging"). Production: deploy-production.yml.
name: Deploy staging (osct.porschuetz.de)

on:
  push:
    branches: [develop]
  workflow_dispatch:

# The called deploy.yml pushes the image to ghcr.io and needs `packages: write`; the repository's default token is
# read-only and a called workflow may not ask for more than its caller grants – so the caller grants it here.
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    uses: ./.github/workflows/deploy.yml
    with:
      destination: staging
    secrets: inherit
