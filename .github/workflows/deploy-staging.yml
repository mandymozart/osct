# Staging https://osct.porschuetz.de with Kamal (deploy.yml, GitHub environment "staging") – app + API in one
# container. By hand only for now: staging stays on the FTPS host (deploy-staging-ftps.yml uploads every push to
# `develop`) until Tilman moves it to the server (Tilman, 2026-11-05); then `push: branches: [develop]` comes back.
# Production: deploy-production.yml.
name: Deploy staging (osct.porschuetz.de)

on:
  workflow_dispatch:

# The called deploy.yml pushes the image to ghcr.io and needs `packages: write`; the repository's default token is
# read-only and a called workflow may not ask for more than its caller grants – so the caller grants it here.
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    uses: ./.github/workflows/deploy.yml
    with:
      destination: staging
    secrets: inherit
