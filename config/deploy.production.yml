# Production: `main` → https://osct.buildingfictions.com (no debug bar). `kamal deploy -d production`
service: osct

# The server is shared with other apps (docs/deploy.md "A shared server"): the app joins the internal network
# `osct` next to the `kamal` network Kamal always adds, and has fixed memory and CPU limits.
servers:
  web:
    hosts:
      - <%= ENV.fetch("SSH_HOST") %>
    options:
      network: osct
      memory: 1g
      cpus: 1

proxy:
  host: osct.buildingfictions.com

# The content store (docs/server.md "Content store and var"): published content and the Library's uploads wherever the
# directory store is the backend (an environment without a CDN) – a named volume on the server, so no deploy loses it.
# Back it up together with the database (docs/deploy.md "Backup").
volumes:
  - osct-content-store:/var/lib/osct/content-store

env:
  clear:
    OSCT_ENV: production
    OSCT_DB_HOST: osct-db
    OSCT_APP_URL: https://osct.buildingfictions.com
    OSCT_ALLOWED_ORIGINS: <%= ENV.fetch("ALLOWED_ORIGINS", "") %>

# The database only on `osct`, so other containers on the server cannot reach it
accessories:
  db:
    network: osct
    options:
      memory: 1g
