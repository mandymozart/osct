<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- First: an address without an experience moves to its experience before anything loads (#343, vite.config.js) -->
    <!--osct:legacy-redirect-->
    <!-- Then: the manifest of the experience the address names – an install installs that experience (#343, vite.config.js) -->
    <!--osct:manifest-link-->
    <!-- Then: a computer gets the desktop landing at once – <html data-osct-landing> (#343, vite.config.js) -->
    <!--osct:landing-decision-->
    <!-- Then: the chosen entry's files are asked for at once (#355, vite.config.js – written in the build only) -->
    <!--osct:entry-preload-->
    <title>Onion Skin and Crocodile Tears - Kevin Bray (buildingfictions)</title>
    <meta name="description" content="Augmented reality companion to Kévin Bray's book Onion Skin &amp; Crocodile Tears (Building Fictions): point your phone at the pages to reveal videos, texts and references." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <!-- PWA (the manifest link: the inline script above; vite-plugin-pwa's own link is taken out): home screen on iOS – name, icon, black status bar -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%OSCT_APP_TITLE%" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <!-- Favicon: Mark the Page with a dark outline (reads on light and dark tab bars) -->
    <link rel="icon" href="/assets/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
    <!-- The app or, on a computer, the landing – one of the two, never both (#355, src/landing/entry.ts); the 8th Wall
         engine loads with the first scan -->
    <script type="module">
      if (document.documentElement.hasAttribute("data-osct-landing")) import("/src/landing/entry.ts");
      else import("/src/main.ts");
    </script>
    <!-- Design font from the CDN font folder (vite.config.js → src/utils/font-face-html.ts) -->
    <!--osct:font-->
    <link rel="stylesheet" href="/src/main.css" />
  </head>
  <body>
    <div id="ar-container"></div>
    <!-- Scanning indicator, toggled by the AR scene while no target is found – styles/gold-spinner.css -->
    <div id="osct-scanning" class="gold-scanning hidden" aria-hidden="true"></div>
    <reader-app id="reader-app"></reader-app>
    <!-- Static landing: the desktop landing page for a computer, written at build time (vite.config.js → src/components/desktop-landing/landing-html.ts) -->
    <!--osct:static-landing-->
    <!-- Static splash: the first onboarding step, written at build time (vite.config.js → src/utils/static-splash-html.ts) -->
    <!--osct:static-splash-->
  </body>
</html>
